[package]
license = "MIT"
description = "A TUI / GUI tool for starting and stopping live streams on bilibili.com, capable of providing the RTMP address and stream key for streaming software such as OBS."
homepage = "https://github.com/HellOwhatAs/bili-live"
repository = "https://github.com/HellOwhatAs/bili-live"
readme = "README.md"
name = "bili-live"
version = "0.1.8"
edition = "2024"

[features]
default = []
gui = ["dep:eframe", "dep:egui", "dep:image", "dep:font-kit"]

[dependencies]
eframe = { version = "0.33", optional = true }
egui = { version = "0.33", optional = true }
font-kit = { version = "0.14.3", optional = true }
image = { version = "0.25", features = ["jpeg", "png"], optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",
    "cookies",
    "rustls-tls",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
md5 = "0.7"
qrcode = "0.14"
url = "2.5"
dirs = "5.0.1"
ratatui = "0.30.0"
crossterm = "0.29.0"
base64 = "0.22.1"
rsa = "0.9.10"
sha2 = "0.10.9"
rand = "0.8.5"
flate2 = "1.1.8"
scraper = "0.25.0"
cookie = "0.18.1"
