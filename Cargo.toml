[package]
license = "MIT"
description = "A command line tool for starting and stopping live streams on bilibili.com, capable of providing the RTMP address and stream key for streaming software such as OBS."
homepage = "https://github.com/HellOwhatAs/bili-live"
repository = "https://github.com/HellOwhatAs/bili-live"
readme = "README.md"
name = "bili-live"
version = "0.1.4"
edition = "2024"

[features]
default = []
gui = ["dep:eframe", "dep:egui", "dep:image"]

[dependencies]
eframe = { version = "0.29.1", optional = true }
egui = { version = "0.29.1", optional = true }
image = { version = "0.25", features = ["jpeg", "png"], optional = true }
reqwest = { version = "0.12", features = ["json", "blocking", "cookies"] } 
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
md5 = "0.7"
qrcode = "0.14"
env_logger = "0.11"
url = "2.5"
ratatui = "0.30.0"
crossterm = "0.29.0"
