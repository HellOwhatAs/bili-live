name: CI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-release:
    name: build-release
    runs-on: ${{ matrix.os }}
    env:
      NAME: bili-live
      CARGO: cargo
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        target: ${{ matrix.target }}

    - name: Setup ARM toolchain
      if: contains(matrix.target, 'aarch64')
      run: |
        sudo apt-get install gcc-aarch64-linux-gnu
        rustup target add ${{ matrix.target }}

    - name: Install musl-tools
      if: contains(matrix.target, 'musl')
      run: |
        sudo apt-get install musl-tools
        if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
           # Use cross for aarch64 musl if needed, or set up cross-compiler manually
           # But for simplicity here, assume 'cross' might be better or complex setup.
           # However, often simplest is to use 'cross' crate if straightforward cross-compilation fails.
           # Let's try installing standard musl dev tools first.
           # Actually, standard approach for aarch64-musl on x64 host often requires 'cross'.
           # Let's adjust env to use 'cross' if it's musl? Or install specific compiler.
           # Installing cross:
           cargo install cross --git https://github.com/cross-rs/cross
           echo "CARGO=cross" >> $GITHUB_ENV
        fi

    - name: Build release binary
      shell: bash
      run: |
        # Build TUI (Default)
        ${{ env.CARGO }} build --release --target=${{ matrix.target }}
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cp target/${{ matrix.target }}/release/${{ env.NAME }}.exe target/${{ matrix.target }}/release/${{ env.NAME }}-${{ matrix.target }}.exe
        else
          cp target/${{ matrix.target }}/release/${{ env.NAME }} target/${{ matrix.target }}/release/${{ env.NAME }}-${{ matrix.target }}
        fi

        # Build GUI (Skip for musl)
        if [[ "${{ matrix.target }}" == *"musl"* ]]; then
          echo "Skipping GUI build for musl target (no X11/Wayland libs)"
        else
          ${{ env.CARGO }} build --release --target=${{ matrix.target }} --features gui
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/${{ env.NAME }}.exe target/${{ matrix.target }}/release/${{ env.NAME }}-${{ matrix.target }}-gui.exe
          else
            cp target/${{ matrix.target }}/release/${{ env.NAME }} target/${{ matrix.target }}/release/${{ env.NAME }}-${{ matrix.target }}-gui
          fi
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.NAME }}-${{ matrix.target }}
        path: target/${{ matrix.target }}/release/${{ env.NAME }}-*

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-release]
    env:
      NAME: bili-live
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: '${{ env.NAME }}-*/${{ env.NAME }}-*'
